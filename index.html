<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Maxin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <h1>MAXIN</h1>
        <select id="stack-selector" class="stack-select" aria-label="Escolher mnemônica"></select>
      </div>
      <div class="header-actions">
        <button id="btn-stacks" type="button" class="btn-ghost">Stacks</button>
        <button id="btn-clear" type="button" class="btn-ghost">Limpar</button>
        <button id="btn-stealth" type="button" class="btn-ghost">Stealth</button>
      </div>
    </header>

    <!-- CARTA ESCOLHIDA PELO ESPECTADOR -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">CARTA ESCOLHIDA</span>
        <strong id="label-target" class="picked-name">—</strong>
      </div>
      <div id="target-values" class="grid-values"></div>
      <div id="target-suits" class="grid-suits"></div>
    </section>

    <!-- PEEK DA CARTA DE BAIXO DO BARALHO (BOCA) -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">PEEK DA CARTA DE BAIXO (BOCA)</span>
        <strong id="label-bottom" class="picked-name">—</strong>
      </div>
      <div id="bottom-values" class="grid-values"></div>
      <div id="bottom-suits" class="grid-suits"></div>
    </section>

    <!-- RESULTADO IMEDIATO: TOPO, BOCA E FRASE -->
    <section id="result-panel" class="result-panel hidden">
      <div class="positions-row">
        <div class="pos-card primary">
          <small>PELO TOPO</small>
          <strong id="pos-top">—</strong>
          <span>ª carta</span>
        </div>
        <div class="pos-card secondary">
          <small>PELA BOCA</small>
          <strong id="pos-bottom">—</strong>
          <span>ª carta</span>
        </div>
      </div>

      <div class="phrase-box">
        <small id="phrase-info">FRASE PARA SOLETRAR</small>
        <div id="phrase-main" class="phrase-main">—</div>
        <div id="phrase-sub" class="phrase-sub">—</div>
      </div>
    </section>
  </div>

  <!-- PAINEL DE MNEMÔNICAS (VER ORDEM E CADASTRAR NOVA) -->
  <div id="modal-stacks" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Mnemônicas</h2>
        <button id="btn-close-stacks" type="button" class="btn-ghost">Fechar</button>
      </div>

      <!-- ESCOLHER MNEMÔNICA E VER ORDEM -->
      <div class="box-block">
        <div class="row-between">
          <label for="modal-stack-select" class="mini-label">Mnemônica ativa:</label>
          <button id="btn-delete-stack" type="button" class="btn-danger hidden">Excluir mnemônica</button>
        </div>
        <select id="modal-stack-select" class="full-select"></select>

        <div id="stack-order-list" class="order-list"></div>
      </div>

      <!-- COLOCAR NOME E AS 52 CARTAS DE UMA NOVA MNEMÔNICA -->
      <div class="box-block">
        <div class="mini-label">Adicionar nova mnemônica (52 cartas)</div>
        <input type="text" id="new-stack-name" placeholder="Nome da mnemônica (ex: Minha Stack)" />
        <textarea id="new-stack-cards" rows="6" placeholder="Cole as 52 cartas uma por linha (ex: 4 de paus ou 4♣)"></textarea>
        <div id="new-stack-error" class="error-msg hidden"></div>
        <button id="btn-save-stack" type="button" class="btn-primary">Salvar Mnemônica</button>
      </div>
    </div>
  </div>

  <!-- Modo Stealth -->
  <div id="stealth-overlay" class="stealth-overlay hidden">
    <div class="stealth-header">
      <span>Notas</span>
      <button id="btn-exit-stealth" type="button" class="btn-stealth-exit">Sair</button>
    </div>
    <div id="stealth-output" class="stealth-note">
      Aguardando cartas...
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
