<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Maxin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <h1>MAXIN</h1>
        <select id="stack-selector" class="stack-select" aria-label="Escolher stack" onchange="changeStack(this.value)"></select>
      </div>
      <div class="header-actions">
        <button id="btn-stacks" type="button" class="btn-ghost" onclick="toggleStacksPanel()">Stacks</button>
        <button id="btn-clear" type="button" class="btn-ghost" onclick="resetAll()">Limpar</button>
        <button id="btn-stealth" type="button" class="btn-ghost" onclick="openStealth()">Stealth</button>
      </div>
    </header>

    <!-- PAINEL DE STACKS -->
    <section id="stacks-panel" class="stacks-panel hidden">
      <div class="panel-top">
        <strong>STACKS / MNEMÔNICAS</strong>
        <button id="btn-close-stacks" type="button" class="btn-ghost" onclick="toggleStacksPanel(false)">Fechar</button>
      </div>
      <p class="panel-hint">Para voltar para a tela principal, toque em <strong>Stacks</strong> ou <strong>Fechar</strong>.</p>

      <div class="row-gap">
        <select id="panel-stack-select" class="full-select" onchange="changeStack(this.value)"></select>
        <button id="btn-delete-stack" type="button" class="btn-danger hidden" onclick="deleteCurrentStack()">Excluir</button>
      </div>

      <div id="stack-order-list" class="order-list"></div>

      <div class="create-stack-box">
        <label class="field-label" for="new-stack-name">Novo stack — nome</label>
        <input id="new-stack-name" type="text" placeholder="Ex: Si Stebbins ECOP" />

        <label class="field-label" for="new-stack-cards">Novo stack — 52 cartas (uma por linha ou separadas por vírgula)</label>
        <textarea id="new-stack-cards" rows="6" placeholder="ás de copas&#10;2 de ouros&#10;8 de espadas"></textarea>

        <div id="new-stack-feedback" class="feedback hidden"></div>
        <button id="btn-save-stack" type="button" class="btn-primary" onclick="saveCustomStack()">Salvar Novo Stack</button>
      </div>
    </section>

    <!-- 1. CARTA ESCOLHIDA -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">CARTA ESCOLHIDA</span>
        <strong id="label-target" class="picked-name">—</strong>
      </div>
      <div id="target-values" class="grid-values"></div>
      <div id="target-suits" class="grid-suits"></div>
    </section>

    <!-- 2. PEEK DA CARTA DE BAIXO (BOCA) -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">PEEK DA CARTA DE BAIXO (BOCA)</span>
        <strong id="label-bottom" class="picked-name">—</strong>
      </div>
      <div id="bottom-values" class="grid-values"></div>
      <div id="bottom-suits" class="grid-suits"></div>
    </section>

    <!-- RESULTADO: TOPO, BOCA E FRASES -->
    <section id="result-panel" class="result-panel hidden">
      <div class="positions-row">
        <div class="pos-card primary">
          <small>PELO TOPO</small>
          <strong id="pos-top">—</strong>
          <span>ª carta</span>
        </div>
        <div class="pos-card secondary">
          <small>PELA BOCA</small>
          <strong id="pos-bottom">—</strong>
          <span>ª carta</span>
        </div>
      </div>

      <div class="phrases-stack">
        <div class="phrase-box top-box">
          <small id="phrase-top-info">FRASE CONTANDO PELO TOPO</small>
          <div id="phrase-top-main" class="phrase-main">—</div>
          <div id="phrase-top-sub" class="phrase-sub">—</div>
        </div>

        <div class="phrase-box bottom-box">
          <small id="phrase-bottom-info">FRASE CONTANDO PELA BOCA</small>
          <div id="phrase-bottom-main" class="phrase-main">—</div>
          <div id="phrase-bottom-sub" class="phrase-sub">—</div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modo Stealth -->
  <div id="stealth-overlay" class="stealth-overlay hidden">
    <div class="stealth-header">
      <span>Notas</span>
      <button id="btn-exit-stealth" type="button" class="btn-stealth-exit" onclick="closeStealth()">Sair</button>
    </div>
    <div id="stealth-output" class="stealth-note">
      Aguardando cartas...
    </div>
  </div>

  <script src="app.js?v=20261124_4"></script>
</body>
</html>
