<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Maxin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>MAXIN</h1>
        <span class="badge">Tamariz</span>
      </div>
      <div class="header-actions">
        <button id="btn-clear" class="btn-ghost">Limpar</button>
        <button id="btn-stealth" class="btn-ghost">Stealth</button>
      </div>
    </header>

    <!-- 1. PEEK DA CARTA DA BOCA -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">1. PEEK DA BOCA (BASE)</span>
        <strong id="label-bottom" class="picked-name">—</strong>
      </div>
      <div id="bottom-values" class="grid-values"></div>
      <div id="bottom-suits" class="grid-suits"></div>
    </section>

    <!-- TOPO ATUAL -->
    <section id="top-card-banner" class="top-banner hidden">
      <small>CARTA NO TOPO ATUAL</small>
      <strong id="top-card-name">—</strong>
    </section>

    <!-- 2. CARTA DITA PELO ESPECTADOR (PULA DIRETO PARA A POSIÇÃO DELA) -->
    <section id="target-section" class="picker-box hidden">
      <div class="box-header">
        <span class="step-tag">2. CARTA DITA (OPCIONAL)</span>
        <strong id="label-target" class="picked-name">—</strong>
      </div>
      <div id="target-values" class="grid-values"></div>
      <div id="target-suits" class="grid-suits"></div>
    </section>

    <!-- POSIÇÃO E FRASES PARA SOLETRAR -->
    <section id="pos-section" class="pos-section hidden">
      <div class="box-header">
        <span class="step-tag">POSIÇÃO PARA CONTAR / SOLETRAR</span>
        <div class="pos-controls">
          <button id="btn-minus" class="btn-step">−</button>
          <span id="current-pos-display" class="pos-num">1</span>
          <button id="btn-plus" class="btn-step">+</button>
        </div>
      </div>

      <div class="card-at-pos">
        <small>Carta nessa posição:</small>
        <strong id="card-at-pos-name">—</strong>
        <span id="card-from-bottom-info">—</span>
      </div>

      <div id="phrases-list" class="phrases-list"></div>
    </section>
  </div>

  <!-- Modo Stealth -->
  <div id="stealth-overlay" class="stealth-overlay hidden">
    <div class="stealth-header">
      <span>Notas</span>
      <button id="btn-exit-stealth" class="btn-stealth-exit">Sair</button>
    </div>
    <div id="stealth-output" class="stealth-note">
      Aguardando peek da carta da boca...
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
