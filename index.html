<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Maxin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>MAXIN</h1>
        <span class="badge">Tamariz</span>
      </div>
      <div class="header-actions">
        <button id="btn-clear" class="btn-ghost">Limpar</button>
        <button id="btn-stealth" class="btn-ghost">Stealth</button>
      </div>
    </header>

    <!-- 1. CARTA DITA PELA PESSOA -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">1. CARTA DITA PELA PESSOA</span>
        <strong id="label-target" class="picked-name">—</strong>
      </div>
      <div id="target-values" class="grid-values"></div>
      <div id="target-suits" class="grid-suits"></div>
    </section>

    <!-- 2. PEEK DA ÚLTIMA CARTA (BOCA) -->
    <section class="picker-box">
      <div class="box-header">
        <span class="step-tag">2. PEEK DA ÚLTIMA CARTA (BOCA)</span>
        <strong id="label-bottom" class="picked-name">—</strong>
      </div>
      <div id="bottom-values" class="grid-values"></div>
      <div id="bottom-suits" class="grid-suits"></div>
    </section>

    <!-- POSIÇÕES + FRASE PARA SOLETRAR -->
    <section id="result-panel" class="result-panel hidden">
      <div class="positions-row">
        <div class="pos-card primary">
          <small>POSIÇÃO PELO TOPO</small>
          <strong id="pos-top">—</strong>
          <span>ª carta</span>
        </div>
        <div class="pos-card secondary">
          <small>POSIÇÃO PELA BOCA</small>
          <strong id="pos-bottom">—</strong>
          <span>ª carta</span>
        </div>
      </div>

      <div class="phrases-header">
        <span>FRASE PARA SOLETRAR</span>
        <small id="spell-summary">—</small>
      </div>
      <div id="phrases-list" class="phrases-list"></div>
    </section>
  </div>

  <!-- Modo Stealth -->
  <div id="stealth-overlay" class="stealth-overlay hidden">
    <div class="stealth-header">
      <span>Notas</span>
      <button id="btn-exit-stealth" class="btn-stealth-exit">Sair</button>
    </div>
    <div id="stealth-output" class="stealth-note">
      Aguardando cartas...
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
